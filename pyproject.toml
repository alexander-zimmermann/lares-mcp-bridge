[project]
name = "lares-mcp-bridge"
version = "1.16.0"
description = "MCP server bridging homelab IoT data (KNX, EMS, WARP, SolarEdge) to Claude.ai via TimescaleDB"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.14.7"
authors = [
    { name = "Alexander Zimmermann" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "fastmcp>=4.0.4",
    "uvicorn[standard]>=0.53.0",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "pyjwt[crypto]>=2.14.0",
    "httpx>=0.28.1",
    "cachetools>=7.2.0",
    "prometheus-client>=0.26.0",
    "nats-py[nkeys]>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres]>=4.15.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "types-PyYAML>=6.0.12.20260906",
    "pre-commit>=4.6.2",
]
[project.scripts]
lares-mcp-bridge = "lares_mcp_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lares_mcp_bridge"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# D100/D104 pin the module/package docstring convention; the rest of the D
# family is intentionally off (per-function docstrings are judged in review).
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "D100", "D104", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001"]  # pytest fixtures injected for setup side-effects

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*", "testcontainers.*", "nats", "nats.*"]
ignore_missing_imports = true

# No rule relaxations — src and tests are clean under both mypy --strict and
# Pyright's standard mode (dynamic SQL goes through psycopg.sql composition).
[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
