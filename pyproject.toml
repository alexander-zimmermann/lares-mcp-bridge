[project]
name = "lares-mcp-bridge"
version = "1.34.0"
description = "MCP server bridging homelab IoT data (KNX, EMS, WARP, SolarEdge) to Claude.ai via TimescaleDB"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.15.2"
authors = [
    { name = "Alexander Zimmermann" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Home Automation",
]
dependencies = [
    "fastmcp>=4.1.4",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
    "httpx>=0.28.1",
    "cachetools>=7.2.7",
    "prometheus-client>=0.26.0",
    "nats-py[nkeys]>=2.16.0",
    "lares-diagnostics-engine @ git+https://github.com/alexander-zimmermann/lares-diagnostics-engine@v1.46.0",
    "boto3>=1.43.122",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-psycopg>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres]>=4.15.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "mypy>=2.4.1",
    "types-PyYAML>=6.0.12.20261030",
    "pre-commit>=4.7.0",
    "boto3-stubs[s3]>=1.43.122",
]
[project.scripts]
lares-mcp-bridge = "lares_mcp_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# lares-diagnostics-engine is a git tag, not a PyPI release.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lares_mcp_bridge"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
# D100/D104 pin the module/package docstring convention; the rest of the D
# family is intentionally off (per-function docstrings are judged in review).
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "D100", "D104", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001"]  # pytest fixtures injected for setup side-effects

[tool.mypy]
python_version = "3.15"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fastmcp", "fastmcp.*", "testcontainers.*", "nats", "nats.*"]
ignore_missing_imports = true

# No rule relaxations — src and tests are clean under both mypy --strict and
# Pyright's standard mode (dynamic SQL goes through psycopg.sql composition).
[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
